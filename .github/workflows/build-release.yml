name: Build Windows packages

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: Test build version in X.Y.Z form
        required: true
        default: "1.8.14"
        type: string

permissions:
  contents: read

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Check release tag and source
    runs-on: windows-2022
    timeout-minutes: 15
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      release_date: ${{ steps.metadata.outputs.release_date }}
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Validate release tag
        id: metadata
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.ref_name }}
          BUILD_VERSION: ${{ inputs.version }}
        run: |
          if ($env:EVENT_NAME -eq 'workflow_dispatch') {
            if ($env:BUILD_VERSION -notmatch '^(\d+\.\d+\.\d+)$') {
              throw "Manual build version must use exact X.Y.Z numeric form"
            }
            $version = $env:BUILD_VERSION
          } elseif ($env:RELEASE_TAG -match '^v(\d+\.\d+\.\d+)$') {
            $version = $Matches[1]
          } else {
            throw "Release tag must use exact vX.Y.Z numeric form"
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "release_date=$([DateTime]::UtcNow.ToString('yyyy-MM-ddTHH:mm:ssZ'))" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Install checksum-pinned build tools
        id: tools
        shell: pwsh
        run: '& scripts/install-build-tools.ps1 -ToolsDirectory "$env:RUNNER_TEMP\leomoon-hotkeyz-tools"'

      - name: Run strict checks and regression tests
        shell: pwsh
        env:
          AUTOIT_DIRECTORY: ${{ steps.tools.outputs.autoit_directory }}
        run: '& scripts/check.ps1 -ToolchainDirectory $env:AUTOIT_DIRECTORY'

  build:
    name: Build and verify Windows packages
    needs: check
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install checksum-pinned build tools
        id: tools
        shell: pwsh
        run: '& scripts/install-build-tools.ps1 -ToolsDirectory "$env:RUNNER_TEMP\leomoon-hotkeyz-tools"'

      - name: Build x86 application
        shell: pwsh
        env:
          BUILD_VERSION: ${{ needs.check.outputs.version }}
          AUTOIT_DIRECTORY: ${{ steps.tools.outputs.autoit_directory }}
          AUTOIT3WRAPPER_PATH: ${{ steps.tools.outputs.autoit3wrapper_path }}
        run: '& scripts/build-windows.ps1 -Version $env:BUILD_VERSION -AutoItDirectory $env:AUTOIT_DIRECTORY -AutoIt3WrapperPath $env:AUTOIT3WRAPPER_PATH'

      - name: Package and verify portable and installer artifacts
        shell: pwsh
        env:
          BUILD_VERSION: ${{ needs.check.outputs.version }}
          ISCC_PATH: ${{ steps.tools.outputs.iscc_path }}
          RELEASE_DATE: ${{ needs.check.outputs.release_date }}
          COMMIT_SHA: ${{ github.sha }}
        run: '& scripts/package-windows.ps1 -Version $env:BUILD_VERSION -StageDirectory "build\windows\output" -DistDirectory "dist" -IsccPath $env:ISCC_PATH -ReleaseDate $env:RELEASE_DATE -Commit $env:COMMIT_SHA'

      - name: Upload verified Windows packages
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: leomoon-hotkeyz-${{ needs.check.outputs.version }}-windows-x86-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub release
    if: github.event_name == 'push'
    needs: [check, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out source and tags
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Download verified Windows packages
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: leomoon-hotkeyz-${{ needs.check.outputs.version }}-windows-x86-${{ github.sha }}
          path: release-assets

      - name: Generate release notes with commit list
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous_tag="$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)"
          commit_range="${previous_tag:+$previous_tag..}$GITHUB_REF_NAME"
          {
            echo "Released: ${{ needs.check.outputs.release_date }}"
            echo
            echo "## Commits"
            while IFS= read -r commit_hash; do
              subject="$(git show -s --format=%s "$commit_hash")"
              author_name="$(git show -s --format=%an "$commit_hash")"
              author_login="$(gh api "repos/$GITHUB_REPOSITORY/commits/$commit_hash" --jq '.author.login // empty' 2>/dev/null || true)"
              if [[ -n "$author_login" ]]; then
                printf -- '- %s ([`%s`](https://github.com/%s/commit/%s) by [%s](https://github.com/%s))\n' "$subject" "${commit_hash:0:7}" "$GITHUB_REPOSITORY" "$commit_hash" "$author_name" "$author_login"
              else
                printf -- '- %s ([`%s`](https://github.com/%s/commit/%s) by %s)\n' "$subject" "${commit_hash:0:7}" "$GITHUB_REPOSITORY" "$commit_hash" "$author_name"
              fi
            done < <(git rev-list "$commit_range")
            echo
            echo "## Downloads"
            echo
            echo "The portable ZIP, Windows installer, release manifest, and SHA256 checksums are attached below."
          } > release-notes.md

      - name: Publish release and verified files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="LeoMoon HotKeyz $GITHUB_REF_NAME"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "$title" --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$title" --notes-file release-notes.md
          fi
          gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
